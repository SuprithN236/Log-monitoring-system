# Render Blueprint: one free Docker web service. PostgreSQL and RabbitMQ are external
# (e.g. Neon and CloudAMQP free tiers). Values marked `sync: false` are entered in the Render
# dashboard and are never stored in git.
services:
  - type: web
    name: log-monitoring-engine
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS us-east-2) to keep per-insert latency low.
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: INGEST_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Optional: critical-log emails via Resend. Leave unset to keep alerts console-only.
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
