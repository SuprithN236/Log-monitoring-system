server:
  # PORT is injected by hosting platforms such as Render; SERVER_PORT is for local overrides.
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  # Honour X-Forwarded-* headers from the host's TLS-terminating proxy.
  forward-headers-strategy: framework
  compression:
    enabled: true

spring:
  application:
    name: log-monitoring-engine

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/log_monitoring_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: log-engine-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 10000

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 10s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 10s

log-engine:
  consumers:
    critical:
      concurrency: ${CRITICAL_CONSUMERS:2}
      max-concurrency: ${CRITICAL_MAX_CONSUMERS:8}
      prefetch: 1
    storage:
      concurrency: ${STORAGE_CONSUMERS:2}
      max-concurrency: ${STORAGE_MAX_CONSUMERS:4}
      prefetch: 50
  security:
    # Local-development defaults only. The prod profile requires real values from the environment.
    ingest-api-key: ${INGEST_API_KEY:local-dev-ingest-key}
    jwt-secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-0123456789}
    jwt-expiration: ${JWT_EXPIRATION:PT12H}
    # Sign-in and sign-up attempts allowed per client IP per minute.
    auth-attempts-per-minute: ${AUTH_ATTEMPTS_PER_MINUTE:10}
  alerts:
    email:
      # Critical logs are emailed through Resend (https://resend.com) once both of these are set.
      resend-api-key: ${RESEND_API_KEY:}
      # Comma-separated recipients. With Resend's shared onboarding sender, only the email address
      # of the Resend account owner can receive mail until a domain is verified.
      to: ${ALERT_EMAIL_TO:}
      from: ${ALERT_EMAIL_FROM:Log Monitor <onboarding@resend.dev>}
      cooldown: ${ALERT_EMAIL_COOLDOWN:PT5M}
      max-per-hour: ${ALERT_EMAIL_MAX_PER_HOUR:20}
      # Linked from each email. Render sets RENDER_EXTERNAL_URL to the service's public URL.
      dashboard-url: ${DASHBOARD_URL:${RENDER_EXTERNAL_URL:}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.logmonitoring.engine: INFO
